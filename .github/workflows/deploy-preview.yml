name: Weekly Publish

# Phone: GitHub app → Actions → Weekly Publish → Run workflow.
# Leave tournament blank to auto-detect. Shopify deploy is on by default.
on:
  workflow_dispatch:
    inputs:
      tournament_name:
        description: 'Tournament name (blank = auto-detect from schedule)'
        required: false
        type: string
      skip_event_check:
        description: 'Skip Data Golf event-name guard if names differ'
        required: false
        type: boolean
        default: false
      skip_build:
        description: 'Skip build — redeploy existing HTML to Shopify only'
        required: false
        type: boolean
        default: false
      skip_archive:
        description: 'Skip moving last week into historical/'
        required: false
        type: boolean
        default: false
      no_notify:
        description: 'Skip the review email'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
      SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_RECIPIENTS: ${{ secrets.NOTIFY_RECIPIENTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight secrets
        run: |
          missing=0
          for key in DATAGOLF_API_KEY SHOPIFY_STORE_URL SHOPIFY_ACCESS_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not set in repo secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Required secrets are present"

      - name: Publish weekly (build + Shopify + menu)
        id: publish
        continue-on-error: true
        run: |
          CMD="python scripts/publish_weekly.py"
          if [ -n "${{ inputs.tournament_name }}" ]; then
            CMD="$CMD --tournament '${{ inputs.tournament_name }}'"
          fi
          if [ "${{ inputs.skip_event_check }}" = "true" ]; then
            CMD="$CMD --skip-event-check"
          fi
          if [ "${{ inputs.skip_build }}" = "true" ]; then
            CMD="$CMD --skip-build"
          fi
          if [ "${{ inputs.skip_archive }}" = "true" ]; then
            CMD="$CMD --skip-archive"
          fi
          if [ "${{ inputs.no_notify }}" = "true" ]; then
            CMD="$CMD --no-notify"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Commit generated preview back to repo
        if: always() && steps.publish.conclusion != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            '*.html' \
            data \
            historical \
            out
          if git diff --staged --quiet; then
            echo "No generated files to commit"
            exit 0
          fi
          git commit -m "Publish weekly tournament preview"
          git push

      - name: Upload HTML preview as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-preview-html
          path: '*.html'
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekly Publish"
            echo ""
            echo "**Date**: $(date '+%A, %B %d, %Y')"
            echo ""
            echo "Live site: https://www.golfinthecosmos.com"
            echo ""
            if [ "${{ steps.publish.outcome }}" = "failure" ]; then
              echo "⚠️ **Publish finished with errors** — generated files were still committed if present."
              echo ""
            fi
            if compgen -G "*.html" > /dev/null 2>&1; then
              echo "### Generated previews"
              for f in *.html; do
                size=$(ls -lh "$f" | awk '{print $5}')
                echo "- **$f** ($size)"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Propagate publish failure
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::Weekly publish finished with errors (see publish step logs). Generated files were committed when present."
          exit 1
