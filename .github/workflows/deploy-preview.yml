name: Weekly Tournament Preview Generator

on:
  # Manual trigger with optional tournament override
  workflow_dispatch:
    inputs:
      tournament_name:
        description: 'Tournament name (optional - auto-detects from schedule)'
        required: false
        type: string
      skip_archive:
        description: 'Skip archiving previous tournament'
        required: false
        type: boolean
        default: false
      deploy_to_shopify:
        description: 'Deploy to Shopify after generation'
        required: false
        type: boolean
        default: false

  # Scheduled run - Every Monday at 12 PM PST (8 PM UTC)
  schedule:
    - cron: '0 20 * * 1'

  # Can also trigger on push to main (for testing)
  push:
    branches:
      - main
    paths:
      - 'scripts/weekly_tournament_orchestrator.py'
      - 'scripts/refresh_odds_from_datagolf.py'
      - 'scripts/generate_tournament_html.py'
      - 'data/pga_schedule_2026.json'
      - '.github/workflows/deploy-preview.yml'

jobs:
  generate-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data/tournament_results_cache
          mkdir -p archive
          mkdir -p logs

      - name: Test API connections
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python scripts/test_apis.py || echo "API test completed with warnings"

      - name: Run Weekly Tournament Orchestrator
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Data Golf used for odds; set in mcp_server/config or env
        run: |
          # Orchestrator runs: archive, odds, OWGR, historical (cache), storylines, HTML
          # Build command with optional flags
          CMD="python scripts/weekly_tournament_orchestrator.py"

          # Add tournament override if provided
          if [ -n "${{ inputs.tournament_name }}" ]; then
            CMD="$CMD --tournament '${{ inputs.tournament_name }}'"
          fi

          # Skip archive if requested
          if [ "${{ inputs.skip_archive }}" = "true" ]; then
            CMD="$CMD --skip-archive"
          fi

          # Add deploy flag if requested
          if [ "${{ inputs.deploy_to_shopify }}" = "true" ]; then
            CMD="$CMD --deploy"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Upload HTML preview as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tournament-preview-html
          path: '*.html'
          retention-days: 30
          if-no-files-found: warn

      - name: Upload data files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tournament-data
          path: |
            data/*_players_data.json
            data/*_odds.json
            data/*_storylines.json
          retention-days: 30
          if-no-files-found: warn

      - name: Create deployment summary
        run: |
          echo "## Weekly Tournament Preview Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date '+%A, %B %d, %Y')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List generated HTML files
          if compgen -G "*.html" > /dev/null 2>&1; then
            echo "### Generated Previews" >> $GITHUB_STEP_SUMMARY
            for f in *.html; do
              size=$(ls -lh "$f" | awk '{print $5}')
              echo "- **$f** ($size)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # List data files
          echo "### Data Files" >> $GITHUB_STEP_SUMMARY
          if compgen -G "data/*_players_data.json" > /dev/null 2>&1; then
            for f in data/*_players_data.json; do
              echo "- $f" >> $GITHUB_STEP_SUMMARY
            done
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifacts to review the preview" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload course image to Shopify Files" >> $GITHUB_STEP_SUMMARY
          echo "3. Update crew picks if needed" >> $GITHUB_STEP_SUMMARY
          echo "4. Deploy to Shopify (manual or re-run with deploy flag)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## Preview Generation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- API keys not configured in repository secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limits exceeded" >> $GITHUB_STEP_SUMMARY
          echo "- Tournament not found in schedule" >> $GITHUB_STEP_SUMMARY
          echo "- Missing dependencies" >> $GITHUB_STEP_SUMMARY
